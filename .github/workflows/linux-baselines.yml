name: One-off Linux visual baselines
on:
  push:
    branches: ["fix/open-defects-2026-11-26"]
    paths: [".github/workflows/linux-baselines.yml"]
permissions:
  contents: write
jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual --update-snapshots
      - name: Commit Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git commit -m "test(visual): add Linux baselines generated on CI" || echo "nothing to commit"
          git push
