name: One-off specialty sweep
on:
  push:
    branches: ["chore/eval-sweep"]
    paths: [".github/workflows/eval-sweep.yml"]
jobs:
  live-and-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: test:live (real literature sources)
        continue-on-error: true
        run: npm run test:live 2>&1 | grep -a -E '^# (tests|pass|fail|skipped)|^not ok|^ok|Error' | head -60
      - name: test:prod against aimed2.vercel.app
        continue-on-error: true
        env:
          AIMED_PROD_URL: https://aimed2.vercel.app
        run: npx playwright test tests/prod --workers=2 --reporter=list 2>&1 | grep -a -E '✓|✘|passed|failed|skipped|Error' | head -80
