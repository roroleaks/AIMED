name: One-off specialty sweep
on:
  push:
    branches: ["chore/eval-sweep"]
    paths: [".github/workflows/eval-sweep.yml"]
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run sweep
        continue-on-error: true
        run: npx playwright test tests/eval --workers=2 --reporter=list 2>&1 | grep -a -E '^EVAL\||passed|failed|skipped' 
      - name: Publish results to eval/results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan eval/results
          git rm -rf -q . || true
          mkdir -p out && cp -r eval-out/* out/ 2>/dev/null || true
          git add -f out
          git commit -q -m "eval sweep results" || true
          git push -f origin eval/results
# rerun
