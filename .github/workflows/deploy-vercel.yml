name: Deploy to Vercel (production)

# Deploys every push to main to the Vercel project named below, using only the
# VERCEL_TOKEN repository secret. Skips quietly until it exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set; skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "22"
      - name: Link project by name (team raouf12, project aimed = aimed2.vercel.app)
        if: steps.gate.outputs.go == 'true'
        run: npx --yes vercel@latest link --yes --project aimed --scope raouf12 --token="$VERCEL_TOKEN"
      - name: Deploy (Vercel builds remotely)
        if: steps.gate.outputs.go == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --build-env NEXT_PUBLIC_COMMIT_SHA="${{ github.sha }}"
